# Render Blueprint: backend API + managed Postgres (Mumbai/Singapore region recommended).
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets marked sync:false are entered in the dashboard.
databases:
  - name: courtlife-db
    plan: basic-256mb        # paid plan: free Postgres on Render is deleted after 30 days
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: courtlife-api
    runtime: docker
    plan: starter            # always-on: the free plan sleeps, which stops reminders and calls
    region: singapore
    healthCheckPath: /health
    disk:                    # uploaded case documents
      name: storage
      mountPath: /app/storage
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: courtlife-db, property: connectionString }
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOCAL_STORAGE_DIR
        value: /app/storage
      - key: CORS_ORIGINS
        sync: false          # e.g. https://courtlife.vercel.app
      - key: PUBLIC_BASE_URL
        sync: false          # this service's URL, e.g. https://courtlife-api.onrender.com
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PHONE
        sync: false
      - key: OTP_PROVIDER
        value: messagecentral
      - key: MESSAGECENTRAL_CUSTOMER_ID
        sync: false
      - key: MESSAGECENTRAL_EMAIL
        sync: false
      - key: MESSAGECENTRAL_PASSWORD
        sync: false
      - key: COURT_PROVIDER
        value: ecourtsindia
      - key: ECOURTSINDIA_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMS_PROVIDER
        value: mock          # switch to fast2sms after DLT approval
      - key: VOICE_PROVIDER
        value: mock          # switch to twilio / exotel when keys are ready

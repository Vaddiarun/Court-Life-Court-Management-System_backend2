[project]
name = "court-life-backend"
version = "1.0.0"
description = "Court Management System backend (FastAPI)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*"]
concurrency = ["greenlet", "thread"]

[tool.ruff.lint]
# B008: FastAPI's Query()/File()/Form() defaults are idiomatic. RUF012: mock providers keep class-level call logs.
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ011"]
"app/providers/court/ecourtsindia.py" = ["DTZ007", "FURB162"]
